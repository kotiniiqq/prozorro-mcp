name: release
# On a version tag: test, build the wheel, sdist and the Claude Desktop extension, and attach them to a
# GitHub release, then list the version in the official MCP Registry. The upload to PyPI is done by the
# maintainer before the tag is pushed.
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -e ".[dev]" build twine
      - run: ruff check .
      - run: pytest -q
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/build_mcpb.py
      - name: GitHub release with the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/prozorro-mcp.mcpb --title "$GITHUB_REF_NAME" --generate-notes
  registry:
    # The official MCP Registry checks the "mcp-name" marker in the README on PyPI, so this runs after the
    # maintainer has uploaded the same version there.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
