name: release
# On a version tag: test, build the wheel, sdist and the Claude Desktop extension, and attach them to a
# GitHub release. The upload to PyPI is done by the maintainer.
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]" build twine
      - run: ruff check .
      - run: pytest -q
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/build_mcpb.py
      - name: GitHub release with the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/prozorro-mcp.mcpb --title "$GITHUB_REF_NAME" --generate-notes
